[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devhubsesion"
version = "0.1.0"
description = "Telegram account manager with session strings"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Astrea"}]
requires-python = ">=3.9"
dependencies = ["telethon>=1.34", "nest-asyncio>=1.6"]

[project.urls]
Homepage = "https://github.com/TheDevHubpro/devhubsesion"
Repository = "https://github.com/TheDevHubpro/devhubsesion"

[tool.setuptools.packages.find]
where = ["src"]
